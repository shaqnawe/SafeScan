  <!-- Brand name -->
  <text x="104" y="38" font-size="22" font-weight="500" letter-spacing="1.5" fill="#1A1A1A" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">IngrediQ</text>
  <!-- Thin rule -->
  <line x1="104" y1="46" x2="300" y2="46" stroke="#AAAAAA" stroke-width="0.5"/>
  <!-- Tagline -->
  <text x="104" y="60" font-size="9" letter-spacing="1" fill="#888888" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">HEALTH · FOOD · COSMETICS</text>
