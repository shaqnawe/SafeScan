<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- PWA / mobile — theme color matches the amber accent in both modes -->
    <meta name="theme-color" content="#d97706" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#fbbf24" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="IngrediQ" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />

    <!-- Icons -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/ingrediq-icon.svg" type="image/svg+xml" />

    <!-- Manrope (body) + Newsreader (display) — matches FONT_STACK and FONT_DISPLAY in src/theme.ts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;400;500;600;700;800&family=Newsreader:ital,opsz,wght@0,6..72,400..800;1,6..72,400..800&display=swap"
      rel="stylesheet"
    />

    <title>IngrediQ — Barcode Safety Scanner</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        background: #fafaf7;
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
        /* Safe area insets for notched phones */
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
      }
      @media (prefers-color-scheme: dark) {
        body { background: #0a0a0f; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
