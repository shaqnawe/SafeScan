<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>SafeScan — Premium Dark / Light Compare</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, system-ui, sans-serif;
    background: #f5f5f7;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  header {
    padding: 20px 32px;
    background: #fff;
    border-bottom: 1px solid #e5e5e7;
    display: flex; justify-content: space-between; align-items: center;
  }
  header h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.02em; }
  header a { font-size: 13px; color: #71717a; text-decoration: none; }
  header a:hover { color: #1a1a1f; }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
    padding: 24px 32px;
  }
  .panel {
    background: #fff;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid #e5e5e7;
    box-shadow: 0 4px 20px rgba(0,0,0,0.04);
  }
  .panel-header {
    padding: 14px 20px;
    border-bottom: 1px solid #f0f0f2;
    font-size: 13px;
    font-weight: 600;
    color: #1a1a1f;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; }
  .dot.dark { background: #1a1a1f; }
  .dot.light { background: #fbbf24; box-shadow: 0 0 0 2px rgba(251,191,36,0.2); }
  .panel iframe {
    width: 100%; height: calc(100vh - 160px); border: none;
    background: #fff;
    display: block;
  }
  @media (max-width: 900px) {
    .grid { grid-template-columns: 1fr; }
    .panel iframe { height: 700px; }
  }
</style>
</head>
<body>
  <header>
    <h1>Premium — Dark / Light Compare</h1>
    <a href="index.html">← Back to all mockups</a>
  </header>
  <div class="grid">
    <div class="panel">
      <div class="panel-header"><span class="dot dark"></span>Dark Mode</div>
      <iframe src="04-dark-premium.html"></iframe>
    </div>
    <div class="panel">
      <div class="panel-header"><span class="dot light"></span>Light Mode</div>
      <iframe src="04-light-premium.html"></iframe>
    </div>
  </div>
</body>
</html>
